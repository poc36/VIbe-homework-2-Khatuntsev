<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="card">
    <h1 id="event-title">Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>

    <button type="button" id="show-program" class="button">Показать программу</button>
    <p id="program" class="message" hidden></p>
  </section>

  <p id="data-error" class="error" hidden></p>

  <form id="service-form" class="card" hidden>
    <p><label><input type="checkbox" id="guide"> Экскурсия с гидом</label></p>
    <p><label><input type="checkbox" id="audio"> Аудиогид</label></p>
    <p><label><input type="checkbox" id="catalog"> Каталог выставки</label></p>
    <button type="submit" class="button">Рассчитать</button>

    <p id="choice-error" class="error" hidden></p>
    <p id="result" class="message" hidden></p>
    <p id="report-json" class="message" hidden></p>
  </form>

  <script src="app.js"></script>
</body>
</html>
